# innova.conf configuration file. Lines beginning with # are comments.


# Network-related settings:

# Run on the test network instead of the real Innova network.
#testnet=1

# Connect via a socks4 proxy
#proxy=127.0.0.1:9050

# Use as many addnode= settings as you like to connect to specific peers
#addnode=188.120.246.137:51737

# ... or use as many connect= settings as you like to connect ONLY
# to specific peers:
#connect=188.120.246.137:51737

# Do not use Internet Relay Chat (irc.lfnet.org #innova channel) to
# find other peers.
#noirc=1

# Maximum number of inbound+outbound connections.
#maxconnections=


# JSON-RPC options (for controlling a running process)

# server=1 tells Innova to accept JSON-RPC commands.
#server=1

# You must set rpcuser and rpcpassword to secure the JSON-RPC api
#rpcuser=Ulysseys
#rpcpassword=YourSuperGreatPasswordNumber_385593

# By default, only RPC connections from localhost are allowed.  Specify
# as many rpcallowip= settings as you like to allow connections from
# other hosts (and you may use * as a wildcard character):
#rpcallowip=10.1.1.34
#rpcallowip=192.168.1.*

# Listen for RPC connections on this TCP port:
rpcport=14531

# You can use Innova or innovad to send commands to Innova/innovad
# running on another host using this option:
rpcconnect=127.0.0.1

# Use Secure Sockets Layer (also known as TLS or HTTPS) to communicate
# with innovad -server or Innova
#rpcssl=1

# OpenSSL settings used when rpcssl=1
rpcsslciphers=TLSv1+HIGH:!SSLv2:!aNULL:!eNULL:!AH:!3DES:@STRENGTH
rpcsslcertificatechainfile=server.cert
rpcsslprivatekeyfile=server.pem


# Miscellaneous options

# Set gen=1 to attempt to generate Innova
gen=0

# Pre-generate this many public/private key pairs, so wallet backups will be valid for
# both prior transactions and several dozen future transactions.
keypool=100

# Pay an optional transaction fee every time you send DNR.
paytxfee=0.01

# Allow direct connections for the 'pay via IP address' feature.
#allowreceivebyip=1


# User interface options

# Start Innova minimized
#min=1

# Minimize to the system tray
#minimizetotray=1


# Collateral Node — self-contained local mode
# Innova supports two Collateral Node models: the legacy remote/controller
# model (collateralnode.conf + collateralnode start-alias) and the
# self-contained local model shown below. Full operator guide:
# doc/collateralnode.md
#collateralnode=1
#collateralnodeaddr=<PUBLIC_IP>:14539
#collateralnodeprivkey=<CN_IDENTITY_PRIVATE_KEY>   # generate with: innovad collateralnode genkey
#collateralnodeoutpoint=<TXID>-<VOUT>              # exact 25,000 INN output; no collateralnode.conf needed
#
# When any -bind is used you must list EVERY listener explicitly, e.g.:
#bind=0.0.0.0:14530
#bind=[::]:14530
#bind=0.0.0.0:14539
#bind=[::]:14539
